    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          for (var r of regs) r.unregister();
        });
      }
      if ('caches' in window) {
        caches.keys().then(function(keys) {
          keys.forEach(function(k) { caches.delete(k); });
        });
      }

    <!-- Google tag (gtag.js) — đo lường người chơi ẩn danh, sự kiện game gửi qua src/platform/analytics.ts -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-DWV6WEB5GR"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      // nhãn "nhà" để tách số liệu: nhà mới decheviahe.com / nhà cũ pages.dev / app (Android · iOS · máy tính).
      // App chạy trên cổng riêng (dcvh://) không lưu được cookie → GA dùng mã máy của game làm client_id.
      (function () {
        var app = "__TAURI_INTERNALS__" in window, cfg = {}, ua = navigator.userAgent;
        var plat = !app ? "web" : /android/i.test(ua) ? "android_app" : /iphone|ipad/i.test(ua) ? "ios_app" : "desktop_app";
        if (app) {
          var id = null;
          try {
            id = localStorage.getItem("de-che-via-he/device");
            if (!id || !/^[a-z0-9]{16,40}$/.test(id)) {
              var b = crypto.getRandomValues(new Uint8Array(12));
              id = Array.prototype.map.call(b, function (x) { return x.toString(36).padStart(2, "0"); }).join("").slice(0, 24);
              localStorage.setItem("de-che-via-he/device", id);
            }
          } catch (e) {}
          cfg.client_storage = "none";
          if (id) cfg.client_id = id;
        }
        gtag("set", "user_properties", { home: app ? "app" : location.hostname, app_platform: plat });
        gtag("config", "G-DWV6WEB5GR", cfg);
      })();
    </script>

  <body>
    <div id="app"></div>
    <div id="fps"></div>
    <div id="safe"></div>

    <!-- Mod & Quầy Mới Helper Overlay -->
    <div id="mod-root" style="position:fixed;bottom:12px;left:12px;z-index:9999;font-family:system-ui,-apple-system,sans-serif;">
      <button id="mod-toggle" style="background:#e07a5f;color:#fff;border:none;padding:9px 16px;border-radius:24px;font-size:13px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,0.5);cursor:pointer;display:flex;align-items:center;gap:6px;">
        <span>🏪 Quán Mới & Tiện Ích Mod</span>
      </button>

      <div id="mod-panel" style="display:none;margin-top:8px;background:rgba(26,19,13,0.96);border:1px solid #e07a5fa0;backdrop-filter:blur(12px);color:#fff;padding:14px;border-radius:16px;width:320px;max-height:80vh;overflow-y:auto;box-shadow:0 10px 30px rgba(0,0,0,0.7);font-size:13px;line-height:1.5;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;border-bottom:1px solid #443224;padding-bottom:6px;">
          <b style="color:#f4a261;font-size:14px;">🏪 Quán Mới Khai Trương</b>
          <button id="mod-close" style="background:none;border:none;color:#aaa;cursor:pointer;font-size:18px;padding:0 4px;">✕</button>
        </div>

        <div style="font-size:12px;color:#d0c4b4;margin-bottom:10px;">
          Bấm để khai trương quầy vào ô vỉa hè trống:
        </div>

        <div style="display:flex;flex-direction:column;gap:7px;margin-bottom:12px;">
          <button id="btn-build-quannet" style="background:#1d3557;color:#fff;border:1px solid #457b9d;padding:9px 12px;border-radius:8px;font-weight:bold;cursor:pointer;text-align:left;font-size:13px;">
            🖥️ Khai trương <b>Quán Nét Cỏ</b> (Mì 2 trứng, Sting)
          </button>
          <button id="btn-build-banquat" style="background:#e76f51;color:#fff;border:1px solid #f4a261;padding:9px 12px;border-radius:8px;font-weight:bold;cursor:pointer;text-align:left;font-size:13px;">
            🌀 Khai trương <b>Tiệm Quạt OnlyFans</b> (Bao mát rượi)
          </button>
          <button id="btn-build-banloa" style="background:#9d0208;color:#fff;border:1px solid #dc2f02;padding:9px 12px;border-radius:8px;font-weight:bold;cursor:pointer;text-align:left;font-size:13px;">
            🔊 Khai trương <b>Tiệm Loa Cho Vợ</b> (Bass tức ngực)
          </button>
          <button id="btn-build-banhoa" style="background:#e07a5f;color:#fff;border:1px solid #f2cc8f;padding:9px 12px;border-radius:8px;font-weight:bold;cursor:pointer;text-align:left;font-size:13px;">
            💐 Khai trương <b>Tiệm Hoa Tươi</b> (Hồng tỏ tình)
          </button>
          <button id="btn-build-banxe" style="background:#3d5a80;color:#fff;border:1px solid #98c1d9;padding:9px 12px;border-radius:8px;font-weight:bold;cursor:pointer;text-align:left;font-size:13px;">
            🚗 Khai trương <b>Salon Ô Tô - Xe Máy</b> (Wave, SH)
          </button>
          <button id="btn-build-stall" style="background:#d4a373;color:#2b211b;border:none;padding:8px 12px;border-radius:8px;font-weight:bold;cursor:pointer;text-align:left;font-size:12px;">
            🥞 Khai trương Tiệm Bánh Xèo Miền Tây
          </button>
        </div>

        <div style="border-top:1px solid #443224;padding-top:10px;margin-bottom:8px;">
          <b style="color:#f4a261;font-size:13px;">⚙️ Tiện Ích Hỗ Trợ</b>
        </div>

        <div style="display:flex;flex-direction:column;gap:7px;">
          <button id="btn-start-game" style="background:#38b000;color:#fff;border:none;padding:9px 12px;border-radius:8px;font-weight:bold;cursor:pointer;text-align:left;font-size:13px;">
            ▶ Bắt đầu vào chơi ngay
          </button>
          <button id="btn-add-money" style="background:#2a9d8f;color:#fff;border:none;padding:8px 12px;border-radius:8px;font-weight:bold;cursor:pointer;text-align:left;font-size:12px;">
            💰 +1.000.000đ vốn làm ăn
          </button>
          <button id="btn-unlock-street" style="background:#e76f51;color:#fff;border:none;padding:8px 12px;border-radius:8px;font-weight:bold;cursor:pointer;text-align:left;font-size:12px;">
            🔓 Mở khóa phố & vỉa hè ngay
          </button>
          <button id="btn-speed" style="background:#457b9d;color:#fff;border:none;padding:8px 12px;border-radius:8px;font-weight:bold;cursor:pointer;text-align:left;font-size:12px;">
            ⚡ Tăng tốc độ game x3
          </button>
        </div>
      </div>
    </div>

    <!-- Nút Bắt Đầu To Nổi Bật Dành Cho Điện Thoại & Trình Duyệt -->
    <button id="quick-start-btn" style="position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:9998;background:#2d8a4e;color:#fff;border:3px solid #fff;border-radius:30px;padding:12px 28px;font-size:17px;font-weight:bold;font-family:system-ui,-apple-system,sans-serif;box-shadow:0 6px 20px rgba(0,0,0,0.5);cursor:pointer;display:flex;align-items:center;gap:8px;">
      <span>🎮 BẮT ĐẦU CHƠI NGAY</span>
    </button>

    <script>
      (function() {
        const toggle = document.getElementById('mod-toggle');
        const panel = document.getElementById('mod-panel');
        const close = document.getElementById('mod-close');
        toggle.addEventListener('click', () => {
          panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
        });
        close.addEventListener('click', () => {
          panel.style.display = 'none';
        });

        const qsBtn = document.getElementById('quick-start-btn');
        function doStart() {
          if (typeof window.startGame === 'function') {
            window.startGame(true);
            if (qsBtn) qsBtn.style.display = 'none';
            return true;
          }
          return false;
        }

        if (qsBtn) {
          qsBtn.addEventListener('click', () => {
            document.querySelector('.dcvh-notice button')?.click();
            if (!doStart()) {
              setTimeout(doStart, 600);
            }
          });
        }

        document.getElementById('btn-start-game').addEventListener('click', () => {
          document.querySelector('.dcvh-notice button')?.click();
          if (!doStart()) {
            setTimeout(doStart, 600);
          }
        });

        // Hide quick-start button when game is playing
        setInterval(() => {
          if (window.__game && window.__game.p && !window.__game.p.demo) {
            if (qsBtn) qsBtn.style.display = 'none';
          }
        }, 1000);

        document.getElementById('btn-add-money').addEventListener('click', () => {
          if (window.__game && window.__game.addMoney) {
            window.__game.addMoney(1000);
          } else {
            alert('Vui lòng đợi game tải xong và bấm Bắt đầu!');
          }
        });

        document.getElementById('btn-unlock-street').addEventListener('click', () => {
          if (window.__game && window.__game.unlockStreet) {
            window.__game.unlockStreet();
          } else {
            alert('Vui lòng đợi game tải xong và bấm Bắt đầu!');
          }
        });

        function tryBuild(fnName, shopName) {
          if (window.__game && window.__game[fnName]) {
            window.__game[fnName]();
          } else {
            alert('Vui lòng đợi game tải xong và bấm Bắt đầu trước khi mở ' + shopName + '!');
          }
        }

        document.getElementById('btn-build-quannet').addEventListener('click', () => {
          tryBuild('buildQuanNet', 'Quán Nét Cỏ');
        });

        document.getElementById('btn-build-banquat').addEventListener('click', () => {
          tryBuild('buildBanQuat', 'Tiệm Quạt OnlyFans');
        });

        document.getElementById('btn-build-banloa').addEventListener('click', () => {
          tryBuild('buildBanLoa', 'Tiệm Loa Cho Vợ');
        });

        document.getElementById('btn-build-banhoa').addEventListener('click', () => {
          tryBuild('buildBanHoa', 'Tiệm Hoa Tươi');
        });

        document.getElementById('btn-build-banxe').addEventListener('click', () => {
          tryBuild('buildBanXe', 'Salon Ô Tô - Xe Máy');
        });

        document.getElementById('btn-build-stall').addEventListener('click', () => {
          tryBuild('buildBanhXeo', 'Tiệm Bánh Xèo');
        });

        let speedFast = false;
        document.getElementById('btn-speed').addEventListener('click', (e) => {
          if (window.app && window.app.ticker) {
            speedFast = !speedFast;
            window.app.ticker.speed = speedFast ? 3 : 1;
            e.target.textContent = speedFast ? '⚡ Đang chạy x3 (Bấm để về x1)' : '⚡ Tăng tốc độ game x3';
          } else {
            alert('Vui lòng đợi game load xong!');
          }
        });
      })();
    </script>
  </body>
