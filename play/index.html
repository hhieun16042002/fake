    <script>
      (function() {
        const toggle = document.getElementById('mod-toggle');
        const panel = document.getElementById('mod-panel');
        const close = document.getElementById('mod-close');
        toggle.addEventListener('click', () => {
          panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
        });
        close.addEventListener('click', () => {
          panel.style.display = 'none';
        });


        // Xoá HHieu khi vào game: luôn khởi động mặc định bình thường với tên Cường
        try {
          localStorage.removeItem('dcvh_player_name');
          sessionStorage.removeItem('dcvh_player_name');
        } catch(e) {}

        let activePlayerName = 'Cường';

        function getPlayerName() {
          if (activePlayerName) return activePlayerName;
          const saved = sessionStorage.getItem('dcvh_player_name');
          if (saved && saved.trim()) return saved.trim();
          if (window.__game && window.__game.p && window.__game.p.playerName) {
            return window.__game.p.playerName.trim();
          }
          return 'Cường';
        }

        function isHHieu(name) {
          const n = (name || getPlayerName()).trim().toLowerCase();
          return n === 'hhieu' || n === 'hhiếu';
        }

        function updateModVisibility() {
          const name = getPlayerName();
          const allow = isHHieu(name);
          const isPlaying = !!(window.__game && window.__game.p && !window.__game.p.demo);
          const isHomeScreen = !isPlaying;

          // 1. Quán mới và tiện ích Mod (chỉ hiện khi đang chơi game và là HHieu)
          const modRoot = document.getElementById('mod-root');
          if (modRoot) {
            modRoot.style.display = (isPlaying && allow) ? 'block' : 'none';
          }
          const panel = document.getElementById('mod-panel');
          if ((!allow || !isPlaying) && panel) {
            panel.style.display = 'none';
          }

          // 2. Thanh tài chính đỉnh màn hình (chỉ hiện khi đang chơi game và là HHieu)
          const topFinBar = document.getElementById('top-fin-bar');
          if (topFinBar) {
            topFinBar.style.display = (isPlaying && allow) ? 'flex' : 'none';
          }

          // 3. Cập nhật thẻ tên (CHỈ Ở TRANG CHỦ MỚI HIỂN THỊ, KHI VÀO GAME KHÔNG HIỂN THỊ NÓ)
          const nameVal = document.getElementById('player-name-val');
          if (nameVal) nameVal.textContent = name;
          const nameBadge = document.getElementById('current-name-badge');
          if (nameBadge) nameBadge.textContent = name;

          const tag = document.getElementById('player-name-tag');
          if (tag) {
            tag.style.display = isHomeScreen ? 'flex' : 'none';
            tag.title = 'Tên: ' + name + ' (Bấm để đổi tên)';
            tag.style.borderColor = allow ? '#2a9d8f' : 'rgba(244,162,97,0.45)';
          }

          // 4. Đồng bộ tên vào game simulation
          if (window.__game && window.__game.p) {
            if (window.__game.p.playerName !== name) {
              window.__game.p.playerName = name;
            }
            if (window.__game.p.hero && window.__game.p.hero.name !== name) {
              window.__game.p.hero.name = name;
            }
          }
        }

        function setPlayerName(newName) {
          if (!newName || !newName.trim()) return;
          const clean = newName.trim();
          activePlayerName = clean;
          try {
            sessionStorage.setItem('dcvh_player_name', clean);
          } catch(e) {}
          updateModVisibility();

          if (window.__game && window.__game.m && window.__game.m.hud && window.__game.m.hud.toast) {
            window.__game.m.hud.toast('Đã đổi tên thành: ' + clean);
          }

          if (isHHieu(clean)) {
            alert('🎉 Xin chào ' + clean + '!');
          } else {
            alert('Đã đổi tên thành: ' + clean);
          }
        }

        function promptRename() {
          const current = getPlayerName();
          const input = prompt('✏️ Nhập tên người chơi mới:', current);
          if (input !== null) {
            const clean = input.trim();
            if (!clean) {
              alert('Tên không được để trống!');
              return;
            }
            setPlayerName(clean);
          }
        }

        window.setPlayerName = setPlayerName;
        window.doiTen = setPlayerName;
        window.promptRename = promptRename;
        window.isHHieu = isHHieu;
        window.updateModVisibility = updateModVisibility;

        document.getElementById('player-name-tag')?.addEventListener('click', promptRename);
        document.getElementById('btn-rename')?.addEventListener('click', promptRename);

        window.addEventListener('keydown', (e) => {
          if ((e.key === 'h' || e.key === 'H') && (e.ctrlKey || e.altKey)) {
            promptRename();
          }
        });

        // Chạy kiểm tra ngay lập tức khi tải trang
        updateModVisibility();

        // Cập nhật mod visibility định kỳ (phản hồi tức thì khi chuyển giữa trang chủ và trong game)
        setInterval(() => {
          updateModVisibility();
        }, 300);

        document.getElementById('btn-add-money').addEventListener('click', () => {
          if (window.__game && window.__game.addMoney) {
            window.__game.addMoney(1000);
          } else {
            alert('Vui lòng đợi game tải xong và bấm Bắt đầu!');
          }
        });

        document.getElementById('btn-unlock-street').addEventListener('click', () => {
          if (window.__game && window.__game.unlockStreet) {
            window.__game.unlockStreet();
          } else {
            alert('Vui lòng đợi game tải xong và bấm Bắt đầu!');
          }
        });

        function tryBuild(fnName, shopName) {
          if (typeof isHHieu === 'function' && !isHHieu()) {
            alert('Quán mới chỉ hiển thị và mở cho người chơi HHieu!');
            return;
          }
          if (window.__game && window.__game[fnName]) {
            window.__game[fnName]();
          } else {
            alert('Vui lòng đợi game tải xong và bấm Bắt đầu trước khi mở ' + shopName + '!');
          }
        }

        document.getElementById('btn-build-quannet').addEventListener('click', () => {
          tryBuild('buildQuanNet', 'Quán Nét Cỏ');
        });

        document.getElementById('btn-build-banquat').addEventListener('click', () => {
          tryBuild('buildBanQuat', 'Tiệm Quạt OnlyFans');
        });

        document.getElementById('btn-build-banloa').addEventListener('click', () => {
          tryBuild('buildBanLoa', 'Tiệm Loa Cho Vợ');
        });

        document.getElementById('btn-build-banhoa').addEventListener('click', () => {
          tryBuild('buildBanHoa', 'Tiệm Hoa Tươi');
        });

        document.getElementById('btn-build-banxe').addEventListener('click', () => {
          tryBuild('buildBanXe', 'Salon Ô Tô - Xe Máy');
        });

        document.getElementById('btn-build-nganhang').addEventListener('click', () => {
          tryBuild('buildNganHang', 'Quầy Ngân Hàng');
        });

        document.getElementById('btn-build-tiemvang').addEventListener('click', () => {
          tryBuild('buildTiemVang', 'Tiệm Vàng');
        });

        document.getElementById('btn-build-tiemtrachanh').addEventListener('click', () => {
          tryBuild('buildTiemTraChanh', 'Trà Chanh');
        });

        document.getElementById('btn-build-stall').addEventListener('click', () => {
          tryBuild('buildBanhXeo', 'Tiệm Bánh Xèo');
        });

        document.getElementById('btn-trigger-robbery')?.addEventListener('click', () => {
          if (typeof window.__triggerBankRobbery === 'function') {
            window.__triggerBankRobbery();
          } else {
            alert('Vui lòng đợi game tải xong!');
          }
        });

        document.getElementById('btn-open-bank')?.addEventListener('click', () => {
          if (typeof window.__openBank === 'function') window.__openBank();
        });

        document.getElementById('btn-open-stocks')?.addEventListener('click', () => {
          if (typeof window.__openStocks === 'function') window.__openStocks();
        });

        // =========================================================================
        // HỆ THỐNG GIAO TIẾP & KÉO KHÁCH HÀNG LOẠT
        // =========================================================================
        window.moiNuocTatCa = function() {
          const sim = window.__game?.p;
          if (!sim) {
            alert('Vui lòng đợi game tải xong và bấm Bắt đầu!');
            return;
          }
          if (typeof window.isHHieu === 'function' && !window.isHHieu()) {
            alert('Chức năng chỉ dành cho người chơi HHieu!');
            return;
          }

          const known = sim.knownIds ? Array.from(sim.knownIds()) : [];
          let count = 0;

          for (let id of known) {
            if (sim.soc && typeof sim.soc.gain === 'function') {
              const newTier = sim.soc.gain(id, 'favor', 25, sim.day);
              if (newTier >= 2 && typeof sim.emit === 'function') {
                try { sim.emit('game', 'relTier', id, { tier: newTier }); } catch(e) {}
              }
            }
            if (sim.contactDone) {
              sim.contactDone['treat:' + id] = sim.day;
            }
            count++;
          }

          if (sim.hero) {
            const heroName = sim.playerName || 'HHieu';
            sim.hero.say = `Mời tất cả bà con cô bác ly trà đá nước mát ${heroName} bao trọn!`;
            sim.hero.sayTimer = 4.0;
          }

          let happyCount = 0;
          if (Array.isArray(sim.people)) {
            const thankLines = [
              'Cảm ơn chủ quán nghen, mát dạ quá!',
              'Quán chu đáo quá trời!',
              'Uống ly nước mát thấy khỏe re!',
              'Chủ quầy hào sảng số một phố Hoa Sữa!',
              'Ngon ngọt mát lành, cảm ơn nghen!'
            ];
            for (let p of sim.people) {
              if (!p.species && p.state !== 'gone') {
                p.say = thankLines[Math.floor(Math.random() * thankLines.length)];
                p.sayTimer = 3.5;
                p.react = { kind: 'happy', t: 3.5, t0: 3.5 };
                happyCount++;
              }
            }
          }

          if (typeof sim.book === 'function') {
            sim.book('chi', 'social', `Mời nước toàn thể ${count} bà con cô bác phố Hoa Sữa`, 0, 0, void 0, sim.playerName || 'HHieu');
          }

          if (window.__game?.m?.hud?.toast) {
            window.__game.m.hud.toast(`🍵 Đã mời nước ${count} người quen & ${happyCount} bà con trên phố! Tình cảm xóm giềng tăng vọt!`);
          } else {
            alert(`🍵 Đã mời nước toàn bộ ${count} người quen & bà con! Tình làng nghĩa xóm gắn kết, không ai còn bị nguội!`);
          }
        };

        window.hoiThamNhaTatCa = function() {
          const sim = window.__game?.p;
          if (!sim) {
            alert('Vui lòng đợi game tải xong và bấm Bắt đầu!');
            return;
          }
          if (typeof window.isHHieu === 'function' && !window.isHHieu()) {
            alert('Chức năng chỉ dành cho người chơi HHieu!');
            return;
          }

          const known = sim.knownIds ? sim.knownIds() : new Set();
          let visitedFamilies = 0;
          let newMembers = 0;

          const allIds = Array.from(known);
          for (let id of allIds) {
            if (sim.soc && typeof sim.soc.gain === 'function') {
              sim.soc.gain(id, 'talk', 20, sim.day);
              sim.soc.gain(id, 'favor', 30, sim.day);
            }
            if (sim.contactDone) {
              sim.contactDone['family:' + id] = sim.day;
            }

            if (typeof sim.familyOf === 'function') {
              try {
                const fam = sim.familyOf(id);
                if (fam && fam.length) {
                  for (let m of fam) {
                    if (!known.has(m.id)) {
                      if (sim.soc) {
                        sim.soc.introduce(id, m.id, sim.day);
                        sim.soc.gain(id, 'talk', 10, sim.day);
                        sim.soc.discover(id, m.id, (sim.kin && sim.kin.pair(id, m.id)) || 'cùng nhà');
                      }
                      known.add(m.id);
                      newMembers++;
                    }
                  }
                }
              } catch(e) {}
            }
            visitedFamilies++;
          }

          if (Array.isArray(sim.slots)) {
            for (let slot of sim.slots) {
              if (slot && slot.lease) {
                slot.lease.last = sim.day;
                if (slot.lease.cause === 'cold') {
                  slot.lease.cause = null;
                  slot.lease.due = false;
                }
              }
            }
          }

          if (sim.hero) {
            sim.hero.say = 'Chúc toàn thể cô chú anh chị em trong xóm luôn dồi dào sức khỏe, an khang!';
            sim.hero.sayTimer = 4.5;
          }

          if (Array.isArray(sim.people)) {
            const replyLines = [
              'Gia đình gửi lời cảm ơn quán nghen!',
              'Có lòng ghé thăm là quý lắm con ơi!',
              'Chúc cháu buôn may bán đắt!',
              'Gặp được người thật thà như vầy mừng ghê!',
              'Bà con ai cũng mến quán!'
            ];
            for (let p of sim.people) {
              if (!p.species && p.state !== 'gone' && Math.random() < 0.8) {
                p.say = replyLines[Math.floor(Math.random() * replyLines.length)];
                p.sayTimer = 3.5;
                p.react = { kind: 'happy', t: 3.5, t0: 3.5 };
              }
            }
          }

          if (typeof sim.book === 'function') {
            sim.book('chi', 'social', `Hỏi thăm nhà hàng loạt ${visitedFamilies} hộ gia đình phố Hoa Sữa`, 0, 0, void 0, sim.playerName || 'HHieu');
          }

          if (window.__game?.m?.hud?.toast) {
            window.__game.m.hud.toast(`🏡 Đã thăm ${visitedFamilies} hộ dân, kết thân thêm ${newMembers} người nhà! Tình làng nghĩa xóm trọn vẹn!`);
          } else {
            alert(`🏡 Đã hỏi thăm nhà hàng loạt ${visitedFamilies} hộ gia đình, kết thân thêm ${newMembers} người thân! Tình làng nghĩa xóm bền chặt!`);
          }
        };

        window.moiGheTatCa = function() {
          const sim = window.__game?.p;
          if (!sim) {
            alert('Vui lòng đợi game tải xong và bấm Bắt đầu!');
            return;
          }
          if (typeof window.isHHieu === 'function' && !window.isHHieu()) {
            alert('Chức năng chỉ dành cho người chơi HHieu!');
            return;
          }

          const activeSlots = (sim.slots || []).filter(s => s && s.stallId && !s.setup && (s.stock == null || s.stock > 0));
          const allPeople = Array.isArray(sim.people) ? sim.people : [];

          // Bộ lọc chuẩn: ai mời được thì mời, ai bận/chặn/làm nhiệm vụ thì giữ nguyên
          function canInvite(p) {
            if (!p || p.species) return false;
            if (p.mounted || p.vehicleId || p.riding) return false;
            if (p.uniform || p.kind === 'police' || p.kind === 'gang') return false;
            if (p.cast || p.duty || p.errand || p.vendor) return false;
            if (p.react) return false;
            if (p.seated || p.state === 'dining' || p.state === 'eating') return false;
            if (p.state === 'toStall' || p.state === 'ordered' || p.state === 'served' || p.state === 'buying') return false;
            if (p.state === 'crossWait' || p.state === 'leaving' || p.state === 'gone') return false;
            if (p.hurry && p.hurry >= 0.55) return false;
            if (p.fade != null && p.fade < 0.85) return false;
            if (typeof sim.bystander === 'function' && !sim.bystander(p)) return false;
            return p.state === 'walking' || p.state === 'idle';
          }

          let invitedCount = 0;

          const acceptLines = [
            'Dạ ghé quán ủng hộ liền nha!',
            'Đông vui quá, tấp vô làm ly/dĩa!',
            'Mùi thơm nức mũi, ghé mua ngay!',
            'Chủ quán mời nhiệt tình quá, ghé liền!',
            'Ủng hộ quán nha, làm phần nóng hổi!'
          ];

          const busyLines = [
            'Đang vội quá, bữa khác ghé nha!',
            'Bận việc gấp rồi con ơi!',
            'Đang đi công việc, hẹn bữa khác!',
            'Để chiều mát tui ghé ủng hộ nghen!'
          ];

          for (let p of allPeople) {
            if (p.species || p.state === 'gone') continue;

            if (canInvite(p)) {
              // Ai mời được thì mời vào quầy
              if (activeSlots.length > 0) {
                const slot = activeSlots[invitedCount % activeSlots.length];
                p.kind = 'stall';
                p.slotIndex = slot.index;
                p.state = 'toStall';
                p.patience = p.patienceMax = 65;
                p.say = acceptLines[Math.floor(Math.random() * acceptLines.length)];
                p.sayTimer = 3.0;
                invitedCount++;
              } else {
                p.kind = 'goods';
                p.state = 'waving';
                p.patience = p.patienceMax = 65;
                p.say = 'Bán cho tui với!';
                p.sayTimer = 3.0;
                invitedCount++;
              }
            } else {
              // Ai dính chặn, bận, làm nhiệm vụ, chạy xe... thì giữ nguyên như cũ!
              if ((p.state === 'walking' || p.hurry) && !p.say && !p.mounted && Math.random() < 0.3) {
                p.say = busyLines[Math.floor(Math.random() * busyLines.length)];
                p.sayTimer = 2.4;
              }
            }
          }

          if (sim.hero) {
            const heroName = sim.playerName || 'HHieu';
            sim.hero.say = `Mời bà con cô bác ai rảnh ghé qua ủng hộ ${heroName} nghen! Bao ngon bao rẻ!`;
            sim.hero.sayTimer = 4.0;
          }

          if (window.__game?.m?.hud?.toast) {
            window.__game.m.hud.toast(`📣 Đã mời ${invitedCount} khách rảnh rỗi vào quầy! (Ai bận/chặn vẫn giữ nguyên)`);
          } else {
            alert(`📣 Đã mời ${invitedCount} khách rảnh rỗi vào quầy! Những người đang bận việc hoặc bị chặn vẫn tiếp tục công việc.`);
          }
        };

        document.getElementById('btn-treat-all')?.addEventListener('click', () => window.moiNuocTatCa());
        document.getElementById('btn-visit-all')?.addEventListener('click', () => window.hoiThamNhaTatCa());
        document.getElementById('btn-call-all')?.addEventListener('click', () => window.moiGheTatCa());

        let speedFast = false;
        document.getElementById('btn-speed').addEventListener('click', (e) => {
          if (window.app && window.app.ticker) {
            speedFast = !speedFast;
            window.app.ticker.speed = speedFast ? 3 : 1;
            e.target.textContent = speedFast ? '⚡ Đang chạy x3 (Bấm để về x1)' : '⚡ Tăng tốc độ game x3';
          } else {
            alert('Vui lòng đợi game load xong!');
          }
        });
      })();
    </script>
  </body>
</html>
